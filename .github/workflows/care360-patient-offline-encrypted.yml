name: Care360 Patient synthetic debug - encrypted output
on:
  push:
    branches:
      - ci/patient-ai-language-preview-20261107
    paths:
      - .github/workflows/care360-patient-offline-encrypted.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character commit SHA from the reviewed Care360 Patient PR'
        type: string
        required: true
        default: '2b2db08d1e52918dfd23d0ebc25a32ecb0ea14ba'

permissions:
  contents: read

concurrency:
  group: care360-patient-private-source-build
  cancel-in-progress: false

jobs:
  android-offline:
    name: Build synthetic patient APK and encrypt output
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Reject missing secrets or invalid source revision before provisioning
        id: validate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || '2b2db08d1e52918dfd23d0ebc25a32ecb0ea14ba' }}
          CARE360_SOURCE_READ_TOKEN: ${{ secrets.CARE360_SOURCE_READ_TOKEN }}
          K3_BUILD_OUTPUT_PASSWORD: ${{ secrets.K3_BUILD_OUTPUT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Provide a reviewed 40-character commit SHA."; exit 1; }
          [[ -n "$CARE360_SOURCE_READ_TOKEN" ]] || { echo "::error::Configure the CARE360_SOURCE_READ_TOKEN encrypted repository secret (Contents: read; Patient only)."; exit 1; }
          [[ "${#K3_BUILD_OUTPUT_PASSWORD}" -ge 32 ]] || { echo "::error::Configure K3_BUILD_OUTPUT_PASSWORD as an unpredictable 32+ character encrypted repository secret."; exit 1; }
          echo "Private-source and output-encryption prerequisites are present."

      - name: Checkout public build scripts only
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Fetch exact commit from private Care360 Patient
        uses: actions/checkout@v4
        with:
          repository: Care360Apps/k3-patient
          ref: ${{ inputs.source_sha || '2b2db08d1e52918dfd23d0ebc25a32ecb0ea14ba' }}
          token: ${{ secrets.CARE360_SOURCE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: patient

      - name: Confirm immutable reviewed revision
        working-directory: patient
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || '2b2db08d1e52918dfd23d0ebc25a32ecb0ea14ba' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Requested Care360 Patient commit verified."

      - name: Free unused Ubuntu runner storage
        shell: bash
        run: |
          set -euo pipefail
          for target in /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if [ -d "$target" ]; then sudo rm -rf -- "$target"; fi
          done
          df -h /

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: false

      - name: Install artifact encryption library
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=44,<48'

      - name: Prepare synthetic-only APK and run focused Flutter tests
        working-directory: patient
        shell: bash
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            flutter config --enable-swift-package-manager
            python3 tools/k3_preflight.py
            python3 tools/k3_notification_preflight.py
            python3 tools/k3_offline_build_fixture.py
            python3 -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'k3_offline_dart_defines.json'); d=json.load(open(p)); assert d['K3_OFFLINE_TEST'] == 'true'; assert d['K3_API_BASE_URL'].startswith('https://k3-offline.invalid/'); print('Synthetic service isolation verified')"
            flutter pub get
            flutter pub get --enforce-lockfile
            git diff --exit-code -- pubspec.lock
            python3 tools/k3_agora_ci_patch.py
            python3 tools/k3_google_api_headers_ci_patch.py
            python3 tools/k3_iris_ci_patch.py
            python3 tools/k3_v1_embedding_scan.py
            dart run build_runner build --delete-conflicting-outputs
            python3 tools/k3_rewrite_generated_url.py
            flutter test --no-pub test/k3_startup_gate_test.dart test/k3_startup_diagnostics_test.dart test/k3_entry_brand_test.dart
            flutter test --no-pub test/k3_offline_dashboard_preview_test.dart
            flutter test --no-pub --dart-define=K3_OFFLINE_TEST=true test/k3_offline_dashboard_preview_test.dart
            flutter test --no-pub test/care360_language_ai_review_test.dart
            flutter test --no-pub --dart-define=K3_OFFLINE_TEST=true test/care360_language_ai_review_test.dart
          ) > "$RUNNER_TEMP/k3-private-build.log" 2>&1 || {
            echo "::error::Care360 dependency preparation or tests failed. Details will be available only in the encrypted artifact."
            exit 1
          }
          echo "Synthetic configuration and focused tests passed."

      - name: Compile ARM64 Android debug APK
        working-directory: patient
        shell: bash
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            flutter build apk --debug --target-platform=android-arm64 \
              --dart-define=K3_BUILD_ENV=staging \
              --dart-define-from-file="$RUNNER_TEMP/k3_offline_dart_defines.json"
          ) >> "$RUNNER_TEMP/k3-private-build.log" 2>&1 || {
            echo "::error::Android compilation failed. Inspect the encrypted diagnostics package; no source snippets are printed publicly."
            exit 1
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "Synthetic-only Patient APK compiled. Runtime validation still required."

      - name: Package build outputs and encrypt before any upload
        id: package
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        env:
          K3_BUILD_OUTPUT_PASSWORD: ${{ secrets.K3_BUILD_OUTPUT_PASSWORD }}
          SOURCE_SHA: ${{ inputs.source_sha || '2b2db08d1e52918dfd23d0ebc25a32ecb0ea14ba' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k3-internal" "$GITHUB_WORKSPACE/builder/dist"
          if [ -s "$RUNNER_TEMP/k3-private-build.log" ]; then
            cp "$RUNNER_TEMP/k3-private-build.log" "$RUNNER_TEMP/k3-internal/build-log.txt"
          fi
          apk="$GITHUB_WORKSPACE/patient/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -s "$apk" ]; then
            cp "$apk" "$RUNNER_TEMP/k3-internal/Care360-Patient-OFFLINE-debug.apk"
            echo "APK included in encrypted bundle"
          else
            echo "No APK produced; encrypted diagnostics only."
          fi
          printf 'Care360 Patient synthetic OFFLINE debug only\nSource SHA: %s\nNo actual staging or production services\n' "$SOURCE_SHA" > "$RUNNER_TEMP/k3-internal/BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/k3-output.tar.gz" -C "$RUNNER_TEMP/k3-internal" .
          python3 "$GITHUB_WORKSPACE/builder/scripts/k3_artifact_crypto.py" --encrypt \
            "$RUNNER_TEMP/k3-output.tar.gz" \
            "$GITHUB_WORKSPACE/builder/dist/Care360-Patient-OFFLINE-debug.tar.gz.k3enc"
          rm -rf "$RUNNER_TEMP/k3-internal"
          rm -f "$RUNNER_TEMP/k3-output.tar.gz"
          echo "Only encrypted output is eligible for public artifact upload."

      - name: Upload ciphertext ONLY (visible to public, but unreadable without password)
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Care360-Patient-OFFLINE-debug-ENCRYPTED
          path: builder/dist/*.k3enc
          retention-days: 1
          if-no-files-found: error
