name: Care360 Patient LAN-connected debug - encrypted output
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed Patient source commit SHA'
        required: true
        default: 'd2f61486355b97e12de193ba4a1deb6da5671a1d'
        type: string
      backend_ipv4:
        description: 'Current laptop private IPv4 running isolated Laravel test API on port 8000'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: care360-patient-lan-connected-debug
  cancel-in-progress: false

jobs:
  android-lan:
    name: Build isolated LAN Patient APK and encrypt source diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Verify prerequisites and explicit local test data approval
        id: validate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CARE360_SOURCE_READ_TOKEN: ${{ secrets.CARE360_SOURCE_READ_TOKEN }}
          K3_BUILD_OUTPUT_PASSWORD: ${{ secrets.K3_BUILD_OUTPUT_PASSWORD }}
          FIREBASE_JSON_B64: ${{ secrets.K3_STAGING_ANDROID_FIREBASE_JSON_B64 }}
          MAPS_KEY: ${{ secrets.K3_STAGING_MAPS_ANDROID_API_KEY }}
          STAGING_KEYSTORE_B64: ${{ secrets.K3_STAGING_PATIENT_DEBUG_KEYSTORE_B64 }}
          STAGING_KEYSTORE_PASSWORD: ${{ secrets.K3_STAGING_PATIENT_KEYSTORE_PASSWORD }}
          STAGING_SIGNING_SHA1: ${{ vars.K3_STAGING_PATIENT_SIGNING_SHA1 }}
          K3_STAGING_FIREBASE_PROJECT_ID: ${{ vars.K3_STAGING_FIREBASE_PROJECT_ID }}
          K3_LAN_LOCAL_DATA_VERIFIED: ${{ vars.K3_LAN_LOCAL_DATA_VERIFIED }}
          K3_LAN_IPV4: ${{ inputs.backend_ipv4 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Provide a 40-character source SHA."; exit 1; }
          [[ -n "$CARE360_SOURCE_READ_TOKEN" ]] || { echo "::error::Set private Patient read-only source token."; exit 1; }
          [[ ${#K3_BUILD_OUTPUT_PASSWORD} -ge 32 ]] || { echo "::error::Set 32+ character output encryption password."; exit 1; }
          [[ -n "$FIREBASE_JSON_B64" ]] || { echo "::error::Set staging Android Firebase JSON base64 repository secret."; exit 1; }
          [[ -n "$MAPS_KEY" && -n "$STAGING_KEYSTORE_B64" && -n "$STAGING_KEYSTORE_PASSWORD" && -n "$STAGING_SIGNING_SHA1" ]] || { echo "::error::Set staging Maps API key, debug signing keystore, password, and approved SHA1."; exit 1; }
          [[ -n "$K3_STAGING_FIREBASE_PROJECT_ID" ]] || { echo "::error::Set approved staging Firebase project ID repository variable."; exit 1; }
          [[ "$K3_LAN_LOCAL_DATA_VERIFIED" == "true" ]] || { echo "::error::Confirm a disposable test-only local Laravel database, then set K3_LAN_LOCAL_DATA_VERIFIED=true."; exit 1; }
          [[ -n "$K3_LAN_IPV4" ]] || { echo "::error::Supply the laptop LAN IPv4."; exit 1; }
          echo "Prerequisites present; no credentials printed."

      - name: Checkout public builder code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: builder

      - name: Checkout pinned private Patient source without persistent credentials
        uses: actions/checkout@v4
        with:
          repository: Care360Apps/k3-patient
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.CARE360_SOURCE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: patient

      - name: Verify source SHA and early source preflight
        working-directory: patient
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/k3_preflight.py
          python3 tools/k3_notification_preflight.py
          python3 -m unittest discover -s tools -p 'test_k3_lan_build_config.py'
          echo "Pinned source and isolation checks passed."

      - name: Validate Gradle wrapper before compilation
        uses: gradle/actions/wrapper-validation@v6

      - name: Free unused runner toolchains
        shell: bash
        run: |
          set -euo pipefail
          for target in /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if [ -d "$target" ]; then sudo rm -rf -- "$target"; fi
          done
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: false

      - name: Install encryption library
        shell: bash
        run: python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=44,<48'

      - name: Prepare isolated Firebase app and private LAN API configuration
        working-directory: patient
        shell: bash
        env:
          K3_LAN_IPV4: ${{ inputs.backend_ipv4 }}
          K3_STAGING_FIREBASE_PROJECT_ID: ${{ vars.K3_STAGING_FIREBASE_PROJECT_ID }}
          FIREBASE_JSON_B64: ${{ secrets.K3_STAGING_ANDROID_FIREBASE_JSON_B64 }}
          K3_STAGING_MAPS_ANDROID_API_KEY: ${{ secrets.K3_STAGING_MAPS_ANDROID_API_KEY }}
          K3_STAGING_PATIENT_DEBUG_KEYSTORE_B64: ${{ secrets.K3_STAGING_PATIENT_DEBUG_KEYSTORE_B64 }}
          K3_STAGING_PATIENT_KEYSTORE_PASSWORD: ${{ secrets.K3_STAGING_PATIENT_KEYSTORE_PASSWORD }}
          K3_STAGING_PATIENT_SIGNING_SHA1: ${{ vars.K3_STAGING_PATIENT_SIGNING_SHA1 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k3-private"
          (
            set -euo pipefail
            printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
            chmod 600 android/app/google-services.json
            python3 tools/k3_lan_build_config.py \
              --ipv4 "$K3_LAN_IPV4" \
              --firebase android/app/google-services.json \
              --out "$RUNNER_TEMP/k3-private/k3_lan_dart_defines.json"
            python3 -c "import json,os; from urllib.parse import urlparse; p=os.path.join(os.environ['RUNNER_TEMP'],'k3-private/k3_lan_dart_defines.json'); d=json.load(open(p)); u=urlparse(d['K3_API_BASE_URL']); assert u.scheme == 'http' and u.port == 8000 and u.path == '/api/'; assert d['K3_FIREBASE_PROJECT_ID'] == os.environ['K3_STAGING_FIREBASE_PROJECT_ID']; print('LAN-only API and isolated Firebase confirmed')"
            python3 "$GITHUB_WORKSPACE/builder/scripts/k3_prepare_patient_maps_signing.py" "$GITHUB_WORKSPACE/patient" "$RUNNER_TEMP/k3-private"
          ) > "$RUNNER_TEMP/k3-private/build-log.txt" 2>&1 || {
            echo "::error::LAN identity, staging Maps signing or Firebase config failed. See encrypted diagnostics artifact."
            exit 1
          }
          echo "K3_STAGING_PATIENT_KEYSTORE_PATH=$RUNNER_TEMP/k3-private/care360-patient-staging.p12" >> "$GITHUB_ENV"
          echo "Private LAN Android debug configuration and staging Maps signing validated."

      - name: Compile connected LAN debug APK and test release guard
        working-directory: patient
        shell: bash
        env:
          K3_STAGING_MAPS_ANDROID_API_KEY: ${{ secrets.K3_STAGING_MAPS_ANDROID_API_KEY }}
          K3_STAGING_PATIENT_KEYSTORE_PASSWORD: ${{ secrets.K3_STAGING_PATIENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            flutter config --enable-swift-package-manager
            flutter pub get
            flutter pub get --enforce-lockfile
            git diff --exit-code -- pubspec.lock
            python3 tools/k3_agora_ci_patch.py
            python3 tools/k3_google_api_headers_ci_patch.py
            python3 tools/k3_iris_ci_patch.py
            python3 tools/k3_v1_embedding_scan.py
            dart run build_runner build --delete-conflicting-outputs
            python3 tools/k3_rewrite_generated_url.py
            # Native splash: use only the actual Care360 master logo.
            python3 -m pip install --quiet --disable-pip-version-check --break-system-packages Pillow
            python3 tools/k3_prepare_launch_brand.py
            dart run flutter_native_splash:create
            flutter test --no-pub test/k3_startup_gate_test.dart test/k3_startup_diagnostics_test.dart test/k3_entry_brand_test.dart
            flutter test --no-pub test/k3_offline_dashboard_preview_test.dart
            # Test integrated real Patient sponsor, guide, African-clinician
            # hero, five-language fallbacks and Nearby Care contracts.
            flutter test --no-pub \
              test/care360_locale_partner_test.dart \
              test/care360_guide_shortcut_test.dart \
              test/care360_nearby_care_hero_test.dart \
              test/care360_language_ai_review_test.dart \
              test/patient_add_address_map_fallback_test.dart \
              test/care360_language_switch_regression_test.dart \
              test/care360_places_proxy_test.dart \
              test/care360_workforce_navigation_test.dart \
              test/care360_first_launch_visual_flow_test.dart
            flutter build apk --debug --target-platform=android-arm64 \
              --dart-define=K3_BUILD_ENV=staging \
              --dart-define-from-file="$RUNNER_TEMP/k3-private/k3_lan_dart_defines.json"
            test -s build/app/outputs/flutter-apk/app-debug.apk
          ) >> "$RUNNER_TEMP/k3-private/build-log.txt" 2>&1 || {
            echo "::error::Private Patient LAN compilation or tests failed. Download encrypted diagnostics; public logs omit private details."
            exit 1
          }
          echo "LAN-configured Patient APK compiled; real BlueStacks sign-in still requires reachable laptop API and staging test account."

      - name: Encrypt APK and diagnostics before public artifact upload
        id: package
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          K3_BUILD_OUTPUT_PASSWORD: ${{ secrets.K3_BUILD_OUTPUT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k3-package" "$GITHUB_WORKSPACE/builder/dist"
          if [ -s "$RUNNER_TEMP/k3-private/build-log.txt" ]; then
            cp "$RUNNER_TEMP/k3-private/build-log.txt" "$RUNNER_TEMP/k3-package/build-log.txt"
          fi
          apk="$GITHUB_WORKSPACE/patient/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -s "$apk" ]; then
            cp "$apk" "$RUNNER_TEMP/k3-package/Care360-Patient-LAN-debug.apk"
            echo "APK included in encrypted bundle."
          else
            echo "No APK produced; encrypted diagnostics only."
          fi
          printf 'Care360 Patient LAN DEBUG ONLY\nSource SHA: %s\nRequires private local test server, staging Firebase and fictional accounts\nNever deploy to clinical or production use\n' "$SOURCE_SHA" > "$RUNNER_TEMP/k3-package/BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/k3-lan-output.tar.gz" -C "$RUNNER_TEMP/k3-package" .
          python3 "$GITHUB_WORKSPACE/builder/scripts/k3_artifact_crypto.py" --encrypt \
            "$RUNNER_TEMP/k3-lan-output.tar.gz" \
            "$GITHUB_WORKSPACE/builder/dist/Care360-Patient-LAN-debug.tar.gz.k3enc"
          rm -rf "$RUNNER_TEMP/k3-package"
          rm -f "$RUNNER_TEMP/k3-lan-output.tar.gz"
          echo "Only encrypted output can be uploaded."

      - name: Upload encrypted output (one day retention)
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Care360-Patient-LAN-debug-ENCRYPTED
          path: builder/dist/*.k3enc
          retention-days: 1
          if-no-files-found: error
